  html.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("theme-knob").textContent  = isDark ? "☀️" : "🌙";
  document.getElementById("theme-label").textContent = isDark ? "☀️ Светлая" : "🌙 Тёмная";
  updateChart();
}

// ── ЗАПОЛНЯЕМ СТРАНИЦУ ────────────────────────────────────────────
function renderPage() {
  const initials = c.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const scoreColor = c.score>=80?"#10b981":c.score>=60?"#f59e0b":"#ef4444";

  // Аватар
  const av = document.getElementById("avatar-circle");
  av.style.background = bg;
  av.style.color = fg;
  av.textContent = initials;

  // Имя
  document.getElementById("cand-name").textContent = c.name;
  document.getElementById("cand-username").textContent = `@${c.username} · ${c.date}`;

  // Статус бейдж
  const sb = document.getElementById("status-badge");
  const statusMap = { shortlist:["badge-shortlist","🌟 Shortlist"], review:["badge-review","🔍 На рассмотрении"], declined:["badge-declined","✕ Отказ"] };
  const [cls, txt] = statusMap[c.status] || ["badge-review","—"];
  sb.className = cls;
  sb.style.cssText += "padding:4px 12px;border-radius:99px;font-size:12px;font-weight:500;";
  sb.textContent = txt;

  // AI бейдж
  const ab = document.getElementById("ai-badge");
  if (c.ai_text) {
    ab.style.cssText = "padding:4px 12px;border-radius:99px;font-size:12px;background:rgba(239,68,68,0.12);color:#ef4444;border:1px solid rgba(239,68,68,0.3);";
    ab.textContent = "🤖 Обнаружен ИИ-текст";
  } else {
    ab.style.cssText = "padding:4px 12px;border-radius:99px;font-size:12px;background:rgba(16,185,129,0.12);color:#10b981;border:1px solid rgba(16,185,129,0.3);";
    ab.textContent = "✍️ Живой текст";
  }

  // Score ring
  const ring = document.getElementById("score-ring");
  ring.style.borderColor = scoreColor;
  document.getElementById("score-num").style.color = scoreColor;
  document.getElementById("score-num").textContent = c.score;

  // Критерии с барами
  const criteria = [
    { label:"Лидерский потенциал", value:c.leadership, max:25, color:"#818cf8" },
    { label:"Траектория роста",    value:c.growth,     max:25, color:"#34d399" },
    { label:"Мотивация / ценности",value:c.motivation, max:25, color:"#fbbf24" },
    { label:"Аутентичность",       value:c.authenticity,max:25, color:"#f472b6" },
  ];
  document.getElementById("criteria-bars").innerHTML = criteria.map(cr=>`
    <div style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <span style="font-size:13px;color:var(--text2);">${cr.label}</span>
        <span style="font-size:13px;font-weight:600;color:${cr.color};">${cr.value}/${cr.max}</span>
      </div>
      <div style="height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;">
        <div class="bar-fill" style="--w:${Math.round(cr.value/cr.max*100)}%;background:${cr.color};"></div>
      </div>
    </div>`).join("");

  // Вывод AI
  document.getElementById("ai-summary").textContent = c.summary;

  // Ответы
  document.getElementById("answers-list").innerHTML = c.answers.map(a=>`
    <div class="answer-block">
      <div class="q">❓ ${a.q}</div>
      <div class="a">${a.a}</div>
    </div>`).join("");
}

// ── RADAR CHART ───────────────────────────────────────────────────
let radarChart = null;

function updateChart() {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const gridColor = isDark ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.1)";
  const labelColor = isDark ? "rgba(255,255,255,0.6)" : "rgba(0,0,0,0.6)";

  if (radarChart) radarChart.destroy();

  radarChart = new Chart(document.getElementById("radarChart"), {
    type: "radar",
    data: {
      labels: ["Лидерство","Рост","Мотивация","Аутентичность"],
      datasets: [{
        data: [c.leadership, c.growth, c.motivation, c.authenticity],
        backgroundColor: "rgba(129,140,248,0.2)",
        borderColor: "#818cf8",
        borderWidth: 2,
        pointBackgroundColor: "#818cf8",
        pointRadius: 4,
      }]
    },
    options: {
      responsive: true,
      scales: {
        r: {
          min: 0, max: 25,
          ticks: { stepSize:5, color:labelColor, backdropColor:"transparent", font:{size:10} },
          grid: { color:gridColor },
          angleLines: { color:gridColor },
          pointLabels: { color:labelColor, font:{size:12} },
        }
      },
      plugins: { legend:{ display:false } },
      animation: { duration:1000 },
    }
  });
}

// ── ДЕЙСТВИЯ ──────────────────────────────────────────────────────
function addToShortlist() {
  alert(`✅ ${c.name} добавлен(а) в Shortlist!`);
}
function declineCandidate() {
  if (confirm(`Отказать ${c.name}?`)) {
    alert("Статус обновлён.");
    location.href = "index.html";
  }
}

// ── СТАРТ ─────────────────────────────────────────────────────────
renderPage();
updateChart();
</script>
</body>
</html>
