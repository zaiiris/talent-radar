<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Кандидат — TalentRadar</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="hero-gradient">
  <div style="display:flex;align-items:center;gap:12px;">
    <button class="back-btn" onclick="location.href='index.html'" id="hdr-back">← Назад</button>
    <span style="color:rgba(255,255,255,0.4);font-size:13px;">TalentRadar · Карточка</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div onclick="location.href='profile.html'" style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#818cf8);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer;">АН</div>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="kz">KZ</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <span style="font-size:12px;color:rgba(255,255,255,0.6);" id="theme-label">🌙 Тёмная</span>
    <div class="theme-toggle" onclick="toggleTheme()"><div class="knob" id="theme-knob">🌙</div></div>
  </div>
</header>

<div style="max-width:1140px;margin:0 auto;padding:26px 28px 48px;">

  <!-- Верхняя секция -->
  <div class="card fade-in" style="display:flex;align-items:center;gap:22px;margin-bottom:18px;flex-wrap:wrap;">
    <div id="avatar-circle" class="avatar" style="width:54px;height:54px;font-size:20px;"></div>
    <div style="flex:1;min-width:180px;">
      <h2 id="cand-name" style="font-size:21px;font-weight:700;margin:0 0 4px;color:var(--text);"></h2>
      <p id="cand-meta" style="font-size:13px;color:var(--text3);margin:0 0 10px;"></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <span id="status-badge" class="badge"></span>
        <span id="ai-badge" class="badge"></span>
      </div>
    </div>
    <!-- Score ring -->
    <div id="score-ring" style="width:108px;height:108px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border:4px solid;flex-shrink:0;box-shadow:0 0 28px rgba(16,185,129,0.25);">
      <div id="score-num" style="font-size:32px;font-weight:700;"></div>
      <div id="score-of" style="font-size:10px;color:var(--text2);">из 100</div>
    </div>
    <!-- Кнопки -->
    <div style="display:flex;flex-direction:column;gap:8px;flex-shrink:0;">
      <button class="btn btn-green" onclick="addToShortlist()" id="btn-sl">🌟 В Shortlist</button>
      <button class="btn btn-danger" onclick="declineCandidate()" id="btn-dc">✕ Отказать</button>
      <button class="btn btn-ghost" onclick="location.href='shortlist.html'" id="btn-sp">📋 Shortlist</button>
    </div>
  </div>

  <!-- Radar + критерии -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;">
    <div class="card fade-in" style="animation-delay:.1s;">
      <h3 id="ttl-profile" style="font-size:14px;font-weight:600;margin:0 0 14px;color:var(--text);">📊 Профиль кандидата</h3>
      <canvas id="radarChart" style="max-width:260px;margin:0 auto;display:block;"></canvas>
    </div>
    <div class="card fade-in" style="animation-delay:.15s;">
      <h3 id="ttl-detail" style="font-size:14px;font-weight:600;margin:0 0 18px;color:var(--text);">🎯 Детальная оценка</h3>
      <div id="criteria-bars"></div>
      <div style="margin-top:14px;padding:12px;background:var(--bg2);border-radius:11px;border:1px solid var(--border);">
        <div id="ttl-summary" style="font-size:11px;color:var(--text3);margin-bottom:5px;">Вывод AI-системы:</div>
        <div id="ai-summary" style="font-size:13px;color:var(--text);line-height:1.6;"></div>
      </div>
    </div>
  </div>

  <!-- Ответы + AI чат -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">

    <div class="card fade-in" style="animation-delay:.2s;">
      <h3 id="ttl-answers" style="font-size:14px;font-weight:600;margin:0 0 14px;color:var(--text);">💬 Ответы из интервью</h3>
      <div id="answers-list"></div>
    </div>

    <!-- AI ЧАТ -->
    <div class="fade-in" style="animation-delay:.25s;">
      <div class="chat-wrap">
        <div class="chat-header">
          <div class="ai-dot"></div>
          <div>
            <div id="ai-title" style="font-size:14px;font-weight:600;color:var(--text);">🤖 AI-ассистент комиссии</div>
            <div id="ai-sub" style="font-size:11px;color:var(--text3);">Claude · Спроси что угодно о кандидате</div>
          </div>
        </div>

        <div id="api-setup" style="padding:12px;border-bottom:1px solid var(--border);">
          <div id="api-lbl" style="font-size:11px;color:var(--text3);margin-bottom:6px;">🔑 Anthropic API Key:</div>
          <div style="display:flex;gap:8px;">
            <input type="password" id="api-key-input" class="api-input"/>
            <button onclick="saveApiKey()" id="api-save-btn" style="background:rgba(99,102,241,0.18);border:1px solid rgba(99,102,241,0.35);color:#818cf8;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;white-space:nowrap;">OK</button>
          </div>
          <div id="api-status" style="font-size:11px;margin-top:5px;color:var(--text3);"></div>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="quick-btns" id="quick-btns"></div>

        <div class="chat-input-wrap">
          <textarea id="chat-input" class="chat-input" rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMessage()" id="send-btn-el">↑</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script>
const id = parseInt(new URLSearchParams(window.location.search).get("id"))||1;
const c  = getCandidate(id);
const [fg,bg] = getAvatarColors(CANDIDATES.indexOf(c));
let radarChart=null, apiKey="";

initLangSwitcher();

function onThemeChange(){ buildChart(); }

function toggleTheme(){
  const html=document.documentElement;
  const isDark=html.getAttribute("data-theme")==="dark";
  html.setAttribute("data-theme",isDark?"light":"dark");
  document.getElementById("theme-knob").textContent=isDark?"☀️":"🌙";
  document.getElementById("theme-label").textContent=isDark?t("lightTheme"):t("darkTheme");
  buildChart();
}

function onLangChange(){
  document.getElementById("hdr-back").textContent       = t("back");
  document.getElementById("theme-label").textContent    = document.documentElement.getAttribute("data-theme")==="dark"?t("darkTheme"):t("lightTheme");
  document.getElementById("score-of").textContent       = t("ofScore");
  document.getElementById("btn-sl").innerHTML           = t("btnShortlist");
  document.getElementById("btn-dc").innerHTML           = t("btnDecline");
  document.getElementById("btn-sp").innerHTML           = t("btnShortlistPage");
  document.getElementById("ttl-profile").textContent    = t("candProfile");
  document.getElementById("ttl-detail").textContent     = t("candDetail");
  document.getElementById("ttl-answers").textContent    = t("candAnswers");
  document.getElementById("ttl-summary").textContent    = t("candSummary");
  document.getElementById("ai-title").textContent       = t("aiTitle");
  document.getElementById("ai-sub").textContent         = t("aiSub");
  document.getElementById("api-lbl").textContent        = t("apiKeyLabel");
  document.getElementById("api-key-input").placeholder  = t("apiKeyPlaceholder");
  document.getElementById("api-save-btn").textContent   = t("apiKeySave");
  document.getElementById("api-status").textContent     = t("apiKeyHint");
  document.getElementById("chat-input").placeholder     = t("chatPlaceholder");
  document.getElementById("send-btn").textContent       = t("chatSend");
  renderCriteria();
  renderAnswers();
  renderQuickBtns();
  renderChatGreeting();
}

function renderPage(){
  const scoreColor = getScoreColor(c.score);
  const {cls} = getStatusInfo(c.status);
  const statusTxt = c.status==="shortlist"?t("badgeShortlist"):c.status==="review"?t("badgeReview"):t("badgeDeclined");
  const av=document.getElementById("avatar-circle");
  av.style.background=bg; av.style.color=fg; av.textContent=getInitials(c.name);
  document.getElementById("cand-name").textContent=c.name;
  document.getElementById("cand-meta").textContent=`@${c.username} · ${c.date}`;
  const sb=document.getElementById("status-badge"); sb.className=`badge ${cls}`; sb.textContent=statusTxt;
  const ab=document.getElementById("ai-badge");
  if(c.ai_text){ab.className="badge badge-ai"; ab.textContent=t("badgeAI");}
  else{ab.className="badge badge-human"; ab.textContent=t("badgeHuman");}
  const ring=document.getElementById("score-ring");
  ring.style.borderColor=scoreColor; ring.style.boxShadow=`0 0 28px ${scoreColor}44`;
  document.getElementById("score-num").style.color=scoreColor;
  document.getElementById("score-num").textContent=c.score;
}

function renderCriteria(){
  const criteria=[
    {key:"candLeadership",value:c.leadership,  max:25,color:"#818cf8"},
    {key:"candGrowth",    value:c.growth,      max:25,color:"#34d399"},
    {key:"candMotivation",value:c.motivation,  max:25,color:"#fbbf24"},
    {key:"candAuth",      value:c.authenticity,max:25,color:"#f472b6"},
  ];
  document.getElementById("criteria-bars").innerHTML=criteria.map(cr=>`
    <div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
        <span style="font-size:12px;color:var(--text2);">${t(cr.key)}</span>
        <span style="font-size:12px;font-weight:600;color:${cr.color};">${cr.value}/${cr.max}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="--w:${Math.round(cr.value/cr.max*100)}%;background:${cr.color};"></div></div>
    </div>`).join("");
  document.getElementById("ai-summary").textContent=c.summary;
}

function renderAnswers(){
  document.getElementById("answers-list").innerHTML=c.answers.map(a=>`
    <div class="answer-block">
      <div class="q">❓ ${a.q}</div>
      <div class="a">${a.a}</div>
    </div>`).join("");
}

function renderQuickBtns(){
  document.getElementById("quick-btns").innerHTML=[
    {k:"q1",fk:"q1full"},{k:"q2",fk:"q2full"},{k:"q3",fk:"q3full"},{k:"q4",fk:"q4full"}
  ].map(q=>`<button class="quick-btn" onclick="quickAsk('${t(q.fk).replace(/'/g,"\\'")}'">${t(q.k)}</button>`).join("");
}

let greetingAdded=false;
function renderChatGreeting(){
  const msgs=document.getElementById("chat-messages");
  if(!greetingAdded){
    msgs.innerHTML=`<div class="msg msg-ai slide-in"><span class="ai-label">✨ TalentRadar AI</span>${t("aiGreeting")}</div>`;
    greetingAdded=true;
  }
}

function buildChart(){
  const isDark=document.documentElement.getAttribute("data-theme")==="dark";
  const gc=isDark?"rgba(255,255,255,0.1)":"rgba(0,0,0,0.1)";
  const lc=isDark?"rgba(255,255,255,0.6)":"rgba(0,0,0,0.6)";
  if(radarChart)radarChart.destroy();
  radarChart=new Chart(document.getElementById("radarChart"),{
    type:"radar",
    data:{labels:[t("colLeadership"),t("colGrowth"),t("colMotivation"),t("candAuth")],
      datasets:[{data:[c.leadership,c.growth,c.motivation,c.authenticity],
        backgroundColor:"rgba(129,140,248,0.18)",borderColor:"#818cf8",
        borderWidth:2,pointBackgroundColor:"#818cf8",pointRadius:4}]},
    options:{responsive:true,
      scales:{r:{min:0,max:25,ticks:{stepSize:5,color:lc,backdropColor:"transparent",font:{size:10}},
        grid:{color:gc},angleLines:{color:gc},pointLabels:{color:lc,font:{size:12}}}},
      plugins:{legend:{display:false}},animation:{duration:900}}
  });
}

// AI ЧАТ
function saveApiKey(){
  const val=document.getElementById("api-key-input").value.trim();
  const status=document.getElementById("api-status");
  if(!val.startsWith("sk-ant-")){status.textContent=t("apiKeyError");status.style.color="#ef4444";return;}
  apiKey=val; status.textContent=t("apiKeyOk"); status.style.color="#10b981";
  document.getElementById("api-setup").style.background="rgba(16,185,129,0.05)";
}

function buildSystemPrompt(){
  return `You are an AI assistant for the inVision U admissions committee (Kazakhstan, inDrive grants).
Analyse only the data below. Reply in the same language the user writes in.

Candidate: ${c.name} (@${c.username})
Score: ${c.score}/100 | Leadership:${c.leadership} Growth:${c.growth} Motivation:${c.motivation} Authenticity:${c.authenticity}
Status: ${c.status} | AI-generated text: ${c.ai_text?"Yes":"No"}
Summary: ${c.summary}

Interview answers:
${c.answers.map(a=>`Q: ${a.q}\nA: ${a.a}`).join("\n\n")}`;
}

async function sendMessage(){
  const input=document.getElementById("chat-input");
  const text=input.value.trim(); if(!text)return;
  if(!apiKey){addMsg("ai",t("chatNoKey"));return;}
  input.value=""; addMsg("user",text); showTyping();
  document.getElementById("send-btn").disabled=true;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":apiKey,
        "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,
        system:buildSystemPrompt(),messages:[{role:"user",content:text}]})
    });
    const data=await res.json(); hideTyping();
    addMsg("ai",data.content?.[0]?.text||"Error");
  }catch{hideTyping();addMsg("ai",t("chatConnError"));}
  document.getElementById("send-btn").disabled=false;
}

function quickAsk(text){document.getElementById("chat-input").value=text;sendMessage();}

function addMsg(role,text){
  const msgs=document.getElementById("chat-messages");
  const div=document.createElement("div");
  div.className=`msg msg-${role} slide-in`;
  div.innerHTML=role==="ai"
    ?`<span class="ai-label">✨ TalentRadar AI</span>${text}`
    :`<span style="font-size:10px;color:var(--text3);display:block;margin-bottom:3px;">${t("chatUser")}</span>${text}`;
  msgs.appendChild(div); msgs.scrollTop=msgs.scrollHeight;
}

let typingEl=null;
function showTyping(){
  const msgs=document.getElementById("chat-messages");
  typingEl=document.createElement("div"); typingEl.className="typing-indicator";
  typingEl.innerHTML=`<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
  msgs.appendChild(typingEl); msgs.scrollTop=msgs.scrollHeight;
}
function hideTyping(){if(typingEl){typingEl.remove();typingEl=null;}}

function addToShortlist(){addMsg("ai",t("addedShortlist"));}
function declineCandidate(){if(confirm(t("confirmDecline")))addMsg("ai",t("declinedMsg"));}

renderPage();
onLangChange();
buildChart();
</script>
</body>
</html>
