<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TalentRadar — inVision U</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>

<header class="hero-gradient">
  <div style="display:flex;align-items:center;gap:14px;">
    <div style="width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,0.13);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 2px 12px rgba(0,0,0,0.2);">🎓</div>
    <div>
      <h1 style="font-size:18px;font-weight:700;color:#fff;margin:0;" id="hdr-app">TalentRadar</h1>
      <p style="font-size:11px;color:rgba(255,255,255,0.5);margin:0;" id="hdr-sub">inVision U — Приёмная комиссия</p>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <!-- Профиль -->
    <div onclick="location.href='profile.html'" style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#818cf8);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(99,102,241,0.4);">АН</div>
    <!-- Язык -->
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="kz">KZ</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <!-- Тема -->
    <span style="font-size:12px;color:rgba(255,255,255,0.6);" id="theme-label">🌙 Тёмная</span>
    <div class="theme-toggle" onclick="toggleTheme()"><div class="knob" id="theme-knob">🌙</div></div>
  </div>
</header>

<!-- СТАТИСТИКА -->
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:24px 28px 16px;" id="stats-grid"></div>

<!-- ПОИСК И ФИЛЬТРЫ -->
<div style="padding:0 28px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
  <input type="text" id="search-input" class="search-input" oninput="filterCandidates()"/>
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)" id="f-all">Все</button>
  <button class="filter-btn" data-filter="shortlist" onclick="setFilter('shortlist',this)" id="f-short">🟢 Shortlist</button>
  <button class="filter-btn" data-filter="review" onclick="setFilter('review',this)" id="f-review">🟡 На рассмотрении</button>
  <button class="filter-btn" data-filter="declined" onclick="setFilter('declined',this)" id="f-declined">🔴 Отказ</button>
  <span style="margin-left:auto;font-size:13px;color:var(--text3);" id="count-label"></span>
  <button class="btn btn-green" onclick="location.href='shortlist.html'" style="font-size:13px;" id="btn-to-shortlist">🌟 Shortlist →</button>
</div>

<!-- ТАБЛИЦА -->
<div style="padding:0 28px 48px;">
  <div class="table-wrap">
    <div class="table-header" id="table-header">
      <div id="th-candidate">Кандидат</div>
      <div style="text-align:center;" id="th-score">Балл</div>
      <div style="text-align:center;" id="th-lead">Лидерство</div>
      <div style="text-align:center;" id="th-growth">Рост</div>
      <div style="text-align:center;" id="th-motiv">Мотивация</div>
      <div style="text-align:center;" id="th-status">Статус</div>
      <div style="text-align:center;" id="th-text">Текст</div>
    </div>
    <div id="candidates-list"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script>
let currentFilter = "all";

initLangSwitcher();

function onLangChange() {
  document.getElementById("hdr-app").textContent     = t("appName");
  document.getElementById("hdr-sub").textContent     = t("appSub");
  document.getElementById("theme-label").textContent = document.documentElement.getAttribute("data-theme")==="dark" ? t("darkTheme") : t("lightTheme");
  document.getElementById("search-input").placeholder = t("searchPlaceholder");
  document.getElementById("f-all").textContent       = t("filterAll");
  document.getElementById("f-short").textContent     = t("filterShort");
  document.getElementById("f-review").textContent    = t("filterReview");
  document.getElementById("f-declined").textContent  = t("filterDeclined");
  document.getElementById("btn-to-shortlist").innerHTML = `🌟 ${t("shortlistStat")} →`;
  document.getElementById("th-candidate").textContent = t("colCandidate");
  document.getElementById("th-score").textContent    = t("colScore");
  document.getElementById("th-lead").textContent     = t("colLeadership");
  document.getElementById("th-growth").textContent   = t("colGrowth");
  document.getElementById("th-motiv").textContent    = t("colMotivation");
  document.getElementById("th-status").textContent   = t("colStatus");
  document.getElementById("th-text").textContent     = t("colText");
  renderStats();
  filterCandidates();
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute("data-theme")==="dark";
  html.setAttribute("data-theme", isDark?"light":"dark");
  document.getElementById("theme-knob").textContent  = isDark?"☀️":"🌙";
  document.getElementById("theme-label").textContent = isDark ? t("lightTheme") : t("darkTheme");
}

function renderStats() {
  const total = CANDIDATES.length;
  const sl    = CANDIDATES.filter(c=>c.status==="shortlist").length;
  const rev   = CANDIDATES.filter(c=>c.status==="review").length;
  const avg   = Math.round(CANDIDATES.reduce((s,c)=>s+c.score,0)/total);
  const items = [
    { label:t("totalApps"),    value:total, color:"#818cf8", icon:"📋", bar:"#818cf8" },
    { label:t("shortlistStat"),value:sl,    color:"#34d399", icon:"🌟", bar:"#34d399" },
    { label:t("underReview"),  value:rev,   color:"#fbbf24", icon:"🔍", bar:"#fbbf24" },
    { label:t("avgScore"),     value:avg,   color:"#a78bfa", icon:"📊", bar:"#a78bfa" },
  ];
  document.getElementById("stats-grid").innerHTML = items.map((s,i)=>`
    <div class="stat-card fade-in" style="animation-delay:${i*0.08}s;">
      <div class="accent-bar" style="background:${s.bar};"></div>
      <div style="font-size:22px;margin-bottom:10px;">${s.icon}</div>
      <div style="font-size:36px;font-weight:700;color:${s.color};line-height:1;animation:countUp 0.6s ease ${i*0.1}s forwards;opacity:0;">${s.value}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:6px;">${s.label}</div>
    </div>`).join("");
}

function renderCandidates(list) {
  const showing = t("showing");
  document.getElementById("count-label").textContent = `${showing} ${list.length}`;
  const container = document.getElementById("candidates-list");
  if (!list.length) {
    container.innerHTML = `<div style="text-align:center;padding:52px;color:var(--text3);">${t("noResults")}</div>`;
    return;
  }
  container.innerHTML = list.map((c,i)=>{
    const [fg,bg] = getAvatarColors(CANDIDATES.indexOf(c));
    const initials  = getInitials(c.name);
    const barColor  = getScoreColor(c.score);
    const { cls }   = getStatusInfo(c.status);
    const statusTxt = c.status==="shortlist" ? t("badgeShortlist") : c.status==="review" ? t("badgeReview") : t("badgeDeclined");
    const aiLabel   = c.ai_text
      ? `<span class="badge badge-ai">${t("badgeAI")}</span>`
      : `<span class="badge badge-human">${t("badgeHuman")}</span>`;
    return `
      <div class="candidate-row fade-in" style="animation-delay:${i*0.04}s;" onclick="location.href='candidate.html?id=${c.id}'">
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="avatar" style="width:36px;height:36px;font-size:13px;background:${bg};color:${fg};">${initials}</div>
          <div>
            <div style="font-size:14px;font-weight:500;color:var(--text);">${c.name}</div>
            <div style="font-size:12px;color:var(--text3);">@${c.username}</div>
          </div>
        </div>
        <div style="text-align:center;">
          <div style="font-size:20px;font-weight:700;color:${barColor};">${c.score}</div>
          <div class="progress-track" style="margin-top:5px;"><div class="progress-fill" style="--w:${c.score}%;background:${barColor};"></div></div>
        </div>
        <div style="text-align:center;font-size:14px;color:#818cf8;">${c.leadership}<span style="font-size:11px;color:var(--text3)">/25</span></div>
        <div style="text-align:center;font-size:14px;color:#34d399;">${c.growth}<span style="font-size:11px;color:var(--text3)">/25</span></div>
        <div style="text-align:center;font-size:14px;color:#fbbf24;">${c.motivation}<span style="font-size:11px;color:var(--text3)">/25</span></div>
        <div style="text-align:center;"><span class="badge ${cls}">${statusTxt}</span></div>
        <div style="text-align:center;">${aiLabel}</div>
      </div>`;
  }).join("");
}

function filterCandidates() {
  const q = document.getElementById("search-input").value.toLowerCase();
  let list = CANDIDATES;
  if (currentFilter!=="all") list=list.filter(c=>c.status===currentFilter);
  if (q) list=list.filter(c=>c.name.toLowerCase().includes(q));
  renderCandidates(list);
}

function setFilter(f,btn) {
  currentFilter=f;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  filterCandidates();
}

onLangChange();
</script>
</body>
</html>
