<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shortlist — TalentRadar</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header class="hero-gradient">
  <div style="display:flex;align-items:center;gap:14px;">
    <button onclick="location.href='index.html'" class="back-btn" id="hdr-back">← Назад</button>
    <div>
      <h1 style="font-size:17px;font-weight:700;color:#fff;margin:0;" id="hdr-title">🌟 Shortlist</h1>
      <p style="font-size:11px;color:rgba(255,255,255,0.5);margin:0;" id="hdr-sub">Отобранные кандидаты · inVision U 2025</p>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div onclick="location.href='profile.html'" style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#818cf8);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer;">АН</div>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="kz">KZ</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <span style="font-size:12px;color:rgba(255,255,255,0.6);" id="theme-label">🌙 Тёмная</span>
    <div class="theme-toggle" onclick="toggleTheme()"><div class="knob" id="theme-knob">🌙</div></div>
  </div>
</header>

<div style="padding:20px 28px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
  <span style="font-size:14px;color:var(--text2);" id="select-hint">Выбери 2 кандидата для сравнения</span>
  <button class="btn btn-primary" id="compare-btn" onclick="openCompare()" disabled id="btn-compare-el">⚡ Сравнить</button>
  <button class="btn btn-green" onclick="exportPDF()" id="btn-export">📄 Экспорт PDF</button>
  <button class="btn btn-ghost" onclick="celebrateAll()" id="btn-enroll-all">🎉 Зачислить всех!</button>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:20px;padding:20px 28px 48px;" id="shortlist-grid"></div>

<!-- МОДАЛКА -->
<div class="modal-overlay" id="compare-modal" style="display:none;" onclick="closeCompare(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h2 id="modal-title" style="font-size:17px;font-weight:700;margin:0;color:var(--text);">⚡ Сравнение кандидатов</h2>
      <button onclick="closeCompare()" style="background:var(--bg3);border:none;color:var(--text2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;">✕</button>
    </div>
    <div id="compare-content"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script>
const shortlisted = CANDIDATES.filter(c=>c.status==="shortlist");
let selected=[], compareCharts=[];

initLangSwitcher();

function toggleTheme(){
  const html=document.documentElement;
  const isDark=html.getAttribute("data-theme")==="dark";
  html.setAttribute("data-theme",isDark?"light":"dark");
  document.getElementById("theme-knob").textContent=isDark?"☀️":"🌙";
  document.getElementById("theme-label").textContent=isDark?t("lightTheme"):t("darkTheme");
}

function onLangChange(){
  document.getElementById("hdr-back").textContent   = t("back");
  document.getElementById("hdr-title").textContent  = t("shortlistTitle");
  document.getElementById("hdr-sub").textContent    = t("shortlistSub");
  document.getElementById("theme-label").textContent= document.documentElement.getAttribute("data-theme")==="dark"?t("darkTheme"):t("lightTheme");
  document.getElementById("btn-export").innerHTML   = t("btnExport");
  document.getElementById("btn-enroll-all").innerHTML = t("btnEnrollAll");
  document.getElementById("modal-title").textContent = t("compareTitle");
  updateHint();
  renderGrid();
}

function renderGrid(){
  document.getElementById("shortlist-grid").innerHTML=shortlisted.map((c,i)=>{
    const [fg,bg]=getAvatarColors(i);
    const initials=getInitials(c.name);
    const sc=getScoreColor(c.score);
    const isSel=selected.includes(c.id);
    const mini=[
      {l:t("colLeadership"), v:c.leadership,  col:"#818cf8"},
      {l:t("colGrowth"),     v:c.growth,       col:"#34d399"},
      {l:t("colMotivation"), v:c.motivation,   col:"#fbbf24"},
      {l:t("candAuth"),      v:c.authenticity, col:"#f472b6"},
    ];
    return `
      <div class="sl-card fade-in ${isSel?"selected":""}" style="animation-delay:${i*0.08}s;" onclick="toggleSelect(${c.id})">
        <div class="select-check">${isSel?"✓":""}</div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          <div class="avatar" style="width:44px;height:44px;font-size:16px;background:${bg};color:${fg};">${initials}</div>
          <div>
            <div style="font-size:15px;font-weight:600;color:var(--text);">${c.name}</div>
            <div style="font-size:12px;color:var(--text3);">@${c.username}</div>
          </div>
        </div>
        <div style="text-align:center;margin-bottom:16px;">
          <div style="font-size:44px;font-weight:700;color:${sc};line-height:1;">${c.score}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px;">${t("outOf")}</div>
          <div class="progress-track" style="margin-top:10px;"><div class="progress-fill" style="--w:${c.score}%;background:${sc};"></div></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
          ${mini.map(cr=>`<div style="background:var(--bg2);border-radius:10px;padding:9px;border:1px solid var(--border);">
            <div style="font-size:10px;color:var(--text3);margin-bottom:3px;">${cr.l}</div>
            <div style="font-size:17px;font-weight:700;color:${cr.col};">${cr.v}<span style="font-size:10px;color:var(--text3);font-weight:400;">/25</span></div>
          </div>`).join("")}
        </div>
        <div style="font-size:12px;color:var(--text2);line-height:1.5;border-top:1px solid var(--border);padding-top:12px;margin-bottom:14px;">${c.summary}</div>
        <button onclick="event.stopPropagation();celebrate(${c.id})" class="btn btn-green" style="width:100%;">${t("btnEnroll")}</button>
      </div>`;
  }).join("");
}

function toggleSelect(id){
  if(selected.includes(id)) selected=selected.filter(x=>x!==id);
  else{if(selected.length>=2)selected.shift();selected.push(id);}
  updateHint(); renderGrid();
}

function updateHint(){
  const hint=document.getElementById("select-hint");
  const btn=document.getElementById("compare-btn");
  if(selected.length===2){
    hint.textContent=t("selectedHint"); hint.style.color="#10b981"; btn.disabled=false;
  }else{
    hint.textContent=`${t("selectedCount")} ${selected.length}/2`; hint.style.color="var(--text2)"; btn.disabled=true;
  }
}

function openCompare(){
  if(selected.length<2)return;
  const [a,b]=selected.map(id=>CANDIDATES.find(c=>c.id===id));
  const [fgA,bgA]=getAvatarColors(shortlisted.indexOf(a));
  const [fgB,bgB]=getAvatarColors(shortlisted.indexOf(b));
  const rows=[
    {label:t("colScore"),       ka:"score",        max:100},
    {label:t("colLeadership"),  ka:"leadership",   max:25},
    {label:t("colGrowth"),      ka:"growth",       max:25},
    {label:t("colMotivation"),  ka:"motivation",   max:25},
    {label:t("candAuth"),       ka:"authenticity", max:25},
  ];
  document.getElementById("compare-content").innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;margin-bottom:20px;text-align:center;">
      <div><div class="avatar" style="width:44px;height:44px;font-size:16px;background:${bgA};color:${fgA};margin:0 auto 8px;">${getInitials(a.name)}</div>
           <div style="font-size:14px;font-weight:600;color:var(--text);">${a.name}</div></div>
      <div style="display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text3);">vs</div>
      <div><div class="avatar" style="width:44px;height:44px;font-size:16px;background:${bgB};color:${fgB};margin:0 auto 8px;">${getInitials(b.name)}</div>
           <div style="font-size:14px;font-weight:600;color:var(--text);">${b.name}</div></div>
    </div>
    ${rows.map(r=>{
      const va=a[r.ka],vb=b[r.ka],winA=va>vb,winB=vb>va;
      return `<div class="compare-row">
        <div style="text-align:center;">
          <div style="font-size:18px;font-weight:700;color:${winA?"#10b981":winB?"#ef4444":"var(--text)"};">${va}${winA?" 🏆":""}</div>
          <div class="progress-track" style="width:80%;margin:6px auto 0;"><div class="progress-fill" style="--w:${Math.round(va/r.max*100)}%;background:#818cf8;"></div></div>
        </div>
        <div style="text-align:center;font-size:12px;color:var(--text3);">${r.label}</div>
        <div style="text-align:center;">
          <div style="font-size:18px;font-weight:700;color:${winB?"#10b981":winA?"#ef4444":"var(--text)"};">${vb}${winB?" 🏆":""}</div>
          <div class="progress-track" style="width:80%;margin:6px auto 0;"><div class="progress-fill" style="--w:${Math.round(vb/r.max*100)}%;background:#f472b6;"></div></div>
        </div>
      </div>`;
    }).join("")}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px;">
      <div><div style="font-size:11px;color:var(--text3);text-align:center;margin-bottom:8px;">${a.name}</div><canvas id="radarA"></canvas></div>
      <div><div style="font-size:11px;color:var(--text3);text-align:center;margin-bottom:8px;">${b.name}</div><canvas id="radarB"></canvas></div>
    </div>
    <div style="margin-top:18px;padding:14px;background:var(--bg2);border-radius:12px;border:1px solid var(--border);text-align:center;font-size:13px;color:var(--text2);">
      ${a.score>b.score?`${t("compareLeads")} <strong style="color:#10b981">${a.name}</strong> (+${a.score-b.score})`:b.score>a.score?`${t("compareLeads")} <strong style="color:#10b981">${b.name}</strong> (+${b.score-a.score})`:t("compareTie")}
    </div>`;

  document.getElementById("compare-modal").style.display="flex";
  compareCharts.forEach(ch=>ch.destroy()); compareCharts=[];
  const isDark=document.documentElement.getAttribute("data-theme")==="dark";
  const gc=isDark?"rgba(255,255,255,0.1)":"rgba(0,0,0,0.1)";
  const lc=isDark?"rgba(255,255,255,0.6)":"rgba(0,0,0,0.6)";
  [[a,"radarA","#818cf8"],[b,"radarB","#f472b6"]].forEach(([cand,cid,col])=>{
    compareCharts.push(new Chart(document.getElementById(cid),{
      type:"radar",
      data:{labels:[t("colLeadership"),t("colGrowth"),t("colMotivation"),t("candAuth")],
        datasets:[{data:[cand.leadership,cand.growth,cand.motivation,cand.authenticity],
          backgroundColor:`${col}2e`,borderColor:col,borderWidth:2,pointBackgroundColor:col,pointRadius:4}]},
      options:{responsive:true,scales:{r:{min:0,max:25,ticks:{stepSize:5,color:lc,backdropColor:"transparent",font:{size:10}},
        grid:{color:gc},angleLines:{color:gc},pointLabels:{color:lc,font:{size:11}}}},
        plugins:{legend:{display:false}},animation:{duration:700}}
    }));
  });
}

function closeCompare(e){
  if(!e||e.target===document.getElementById("compare-modal")){
    document.getElementById("compare-modal").style.display="none";
    compareCharts.forEach(ch=>ch.destroy()); compareCharts=[];
  }
}

function launchConfetti(count=90){
  const colors=["#818cf8","#34d399","#f472b6","#fbbf24","#60a5fa","#fb7185","#a78bfa"];
  for(let i=0;i<count;i++){
    const el=document.createElement("div"); el.className="confetti-piece";
    el.style.left=Math.random()*100+"vw"; el.style.top="-10px";
    el.style.width=(8+Math.random()*8)+"px"; el.style.height=(8+Math.random()*8)+"px";
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.borderRadius=Math.random()>0.5?"50%":"2px";
    el.style.animationDuration=(1.5+Math.random()*2)+"s";
    el.style.animationDelay=(Math.random()*0.8)+"s";
    document.body.appendChild(el); setTimeout(()=>el.remove(),4000);
  }
}

function celebrate(id){
  launchConfetti(100);
  const c=CANDIDATES.find(x=>x.id===id);
  setTimeout(()=>alert(`🎉 ${c.name} ${t("enrolledMsg")}`),300);
}

function celebrateAll(){
  launchConfetti(200);
  setTimeout(()=>alert(`🎊 ${t("enrolledAllMsg")}`),400);
}

function exportPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  doc.setFillColor(13,13,43); doc.rect(0,0,210,42,"F");
  doc.setTextColor(255,255,255); doc.setFontSize(18); doc.setFont("helvetica","bold");
  doc.text("TalentRadar — inVision U",14,18);
  doc.setFontSize(10); doc.setFont("helvetica","normal");
  doc.text(`${t("shortlistSub")}`,14,28);
  doc.text(`${new Date().toLocaleDateString("ru-RU")}`,14,36);
  let y=54;
  shortlisted.forEach((c,i)=>{
    if(y>240){doc.addPage();y=20;}
    doc.setFillColor(245,245,250); doc.roundedRect(12,y,186,46,4,4,"F");
    doc.setTextColor(26,26,46); doc.setFontSize(13); doc.setFont("helvetica","bold");
    doc.text(`${i+1}. ${c.name}`,18,y+11);
    doc.setFontSize(10); doc.setFont("helvetica","normal"); doc.setTextColor(100,100,120);
    doc.text(`@${c.username}`,18,y+20);
    doc.setFontSize(22); doc.setFont("helvetica","bold"); doc.setTextColor(99,102,241);
    doc.text(`${c.score}`,172,y+17); doc.setFontSize(9); doc.setTextColor(150,150,170); doc.text("/100",184,y+17);
    doc.setFontSize(9); doc.setFont("helvetica","normal"); doc.setTextColor(80,80,100);
    doc.text(`Leadership:${c.leadership}  Growth:${c.growth}  Motivation:${c.motivation}  Auth:${c.authenticity}`,18,y+30);
    const lines=doc.splitTextToSize(c.summary,168);
    doc.setTextColor(120,120,140); doc.text(lines[0],18,y+40);
    y+=54;
  });
  doc.setFontSize(8); doc.setTextColor(150,150,170);
  doc.text("TalentRadar · AI-powered admissions · inVision University",14,285);
  doc.save("shortlist-invision-u-2025.pdf");
}

onLangChange();
</script>
</body>
</html>
