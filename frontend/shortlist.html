<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shortlist — TalentRadar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { font-family:'Inter',sans-serif; transition:background 0.3s,color 0.3s,border-color 0.3s; box-sizing:border-box; }

    [data-theme="dark"] {
      --bg:#0a0a0f; --bg2:rgba(255,255,255,0.04); --bg3:rgba(255,255,255,0.08);
      --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.14);
      --text:#e2e8f0; --text2:rgba(255,255,255,0.5); --text3:rgba(255,255,255,0.28);
      --card:#111118;
    }
    [data-theme="light"] {
      --bg:#f5f5f7; --bg2:#ffffff; --bg3:#ededf2;
      --border:rgba(0,0,0,0.08); --border2:rgba(0,0,0,0.14);
      --text:#1a1a2e; --text2:rgba(0,0,0,0.5); --text3:rgba(0,0,0,0.32);
      --card:#ffffff;
    }

    body { background:var(--bg); color:var(--text); min-height:100vh; }

    @keyframes fadeInUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    @keyframes confettiFall {
      0%   { transform:translateY(-10px) rotate(0deg);   opacity:1; }
      100% { transform:translateY(100vh) rotate(720deg); opacity:0; }
    }
    @keyframes popIn { from{opacity:0;transform:scale(0.85)} to{opacity:1;transform:scale(1)} }

    .fade-in { animation:fadeInUp 0.5s ease forwards; opacity:0; }
    .hero-gradient { background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460,#533483); background-size:300% 300%; animation:gradientShift 8s ease infinite; }

    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; }

    /* Переключатель темы */
    .theme-toggle { width:52px;height:28px;background:rgba(255,255,255,0.15);border-radius:99px;position:relative;cursor:pointer;border:1px solid rgba(255,255,255,0.25); }
    .theme-toggle .knob { position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform 0.3s;display:flex;align-items:center;justify-content:center;font-size:11px; }
    [data-theme="light"] .theme-toggle .knob { transform:translateX(24px); }

    /* Карточка кандидата в shortlist */
    .sl-card {
      background:var(--card); border:1px solid var(--border2); border-radius:16px;
      padding:20px; cursor:pointer; transition:transform 0.2s,box-shadow 0.2s,border-color 0.2s;
      position:relative;
    }
    .sl-card:hover { transform:translateY(-4px); box-shadow:0 8px 32px rgba(99,102,241,0.15); }
    .sl-card.selected { border-color:#818cf8; box-shadow:0 0 0 2px rgba(129,140,248,0.3); }
    .sl-card .select-check {
      position:absolute; top:12px; right:12px;
      width:22px;height:22px;border-radius:50%;
      border:2px solid var(--border2);
      display:flex;align-items:center;justify-content:center;
      font-size:12px; transition:all 0.2s;
    }
    .sl-card.selected .select-check { background:#818cf8;border-color:#818cf8;color:#fff; }

    /* Кнопки */
    .btn { padding:10px 20px;border-radius:12px;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;border:none; }
    .btn-primary { background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff; }
    .btn-primary:hover { opacity:0.9;transform:translateY(-1px); }
    .btn-green  { background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.35); }
    .btn-green:hover { background:rgba(16,185,129,0.28); }
    .btn-ghost  { background:var(--bg3);color:var(--text2);border:1px solid var(--border2); }
    .btn-ghost:hover { background:var(--border2); }

    /* Конфетти */
    .confetti-piece {
      position:fixed; width:10px; height:10px; border-radius:2px;
      animation:confettiFall linear forwards;
      pointer-events:none; z-index:9999;
    }

    /* Модалка сравнения */
    .modal-overlay {
      position:fixed;inset:0;background:rgba(0,0,0,0.7);
      display:flex;align-items:center;justify-content:center;
      z-index:1000;backdrop-filter:blur(4px);
    }
    .modal-box {
      background:var(--card);border:1px solid var(--border2);border-radius:20px;
      padding:28px;width:90%;max-width:860px;max-height:90vh;overflow-y:auto;
      animation:popIn 0.3s ease forwards;
    }

    .avatar { width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0; }

    /* Таблица сравнения */
    .compare-row { display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--border);padding:10px 0;align-items:center; }
    .compare-row:last-child { border-bottom:none; }
    .compare-label { font-size:12px;color:var(--text3);text-align:center; }
    .compare-val   { font-size:16px;font-weight:700;text-align:center; }
    .compare-bar   { height:6px;border-radius:3px;margin-top:4px; }

    .badge-shortlist { background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.3);padding:3px 10px;border-radius:99px;font-size:11px; }

    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--border2);border-radius:3px; }
  </style>
</head>
<body>

<!-- ШАПКА -->
<header class="hero-gradient" style="padding:18px 32px;display:flex;align-items:center;justify-content:space-between;">
  <div style="display:flex;align-items:center;gap:14px;">
    <button onclick="location.href='index.html'" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:7px 14px;border-radius:10px;cursor:pointer;font-size:13px;">← Назад</button>
    <div>
      <h1 style="font-size:18px;font-weight:700;color:#fff;margin:0;">🌟 Shortlist</h1>
      <p style="font-size:12px;color:rgba(255,255,255,0.6);margin:0;">Отобранные кандидаты · inVision U 2025</p>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="font-size:12px;color:rgba(255,255,255,0.7);" id="theme-label">🌙 Тёмная</span>
    <div class="theme-toggle" onclick="toggleTheme()"><div class="knob" id="theme-knob">🌙</div></div>
  </div>
</header>

<!-- ПАНЕЛЬ ДЕЙСТВИЙ -->
<div style="padding:20px 32px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
  <div style="font-size:14px;color:var(--text2);" id="select-hint">Выбери 2 кандидата для сравнения</div>
  <button class="btn btn-primary" id="compare-btn" onclick="openCompare()" disabled style="opacity:0.4;">⚡ Сравнить выбранных</button>
  <button class="btn btn-green" onclick="exportPDF()">📄 Экспорт PDF</button>
  <button class="btn btn-ghost" onclick="celebrateAll()">🎉 Зачислить всех!</button>
</div>

<!-- СЕТКА SHORTLIST -->
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:20px 32px 40px;" id="shortlist-grid"></div>

<!-- МОДАЛКА СРАВНЕНИЯ -->
<div class="modal-overlay" id="compare-modal" style="display:none;" onclick="closeCompare(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h2 style="font-size:17px;font-weight:700;margin:0;color:var(--text);">⚡ Сравнение кандидатов</h2>
      <button onclick="closeCompare()" style="background:var(--bg3);border:none;color:var(--text2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;">✕</button>
    </div>
    <div id="compare-content"></div>
  </div>
</div>

<script>
const allCandidates = [
  { id:1,  name:"Айгерим Сейткали", username:"aigerim_s",  score:91, leadership:23, growth:24, motivation:25, authenticity:19, status:"shortlist", summary:"Исключительный лидерский потенциал. Конкретные примеры инициатив." },
  { id:2,  name:"Данияр Ахметов",   username:"daniyar_a",  score:84, leadership:21, growth:22, motivation:22, authenticity:19, status:"shortlist", summary:"Сильная траектория роста. Высокая мотивация и ясное видение." },
  { id:3,  name:"Мадина Касымова",  username:"madina_k",   score:78, leadership:19, growth:20, motivation:21, authenticity:18, status:"shortlist", summary:"Чёткое предпринимательское мышление. Реальный опыт запуска." },
  { id:4,  name:"Арман Берсимбаев", username:"arman_b",    score:72, leadership:18, growth:19, motivation:18, authenticity:17, status:"shortlist", summary:"Перспективный кандидат с хорошим потенциалом лидера." },
];

const avatarColors = [
  ["#818cf8","#312e81"],["#34d399","#064e3b"],["#fbbf24","#78350f"],["#f472b6","#831843"],
];

let selected = [];
let compareCharts = [];

// ── ТЕМА ─────────────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute("data-theme") === "dark";
  html.setAttribute("data-theme", isDark ? "light" : "dark");
  document.getElementById("theme-knob").textContent  = isDark ? "☀️" : "🌙";
  document.getElementById("theme-label").textContent = isDark ? "☀️ Светлая" : "🌙 Тёмная";
}

// ── РЕНДЕР КАРТОЧЕК ────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById("shortlist-grid");
  grid.innerHTML = allCandidates.map((c, i) => {
    const [fg, bg] = avatarColors[i % avatarColors.length];
    const initials  = c.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
    const scoreColor = c.score>=80?"#10b981":c.score>=60?"#f59e0b":"#ef4444";
    const isSelected = selected.includes(c.id);

    return `
      <div class="sl-card fade-in ${isSelected?"selected":""}" style="animation-delay:${i*0.08}s;" onclick="toggleSelect(${c.id})">
        <div class="select-check">${isSelected?"✓":""}</div>

        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          <div class="avatar" style="background:${bg};color:${fg};">${initials}</div>
          <div>
            <div style="font-size:15px;font-weight:600;color:var(--text);">${c.name}</div>
            <div style="font-size:12px;color:var(--text3);">@${c.username}</div>
          </div>
        </div>

        <!-- Общий балл -->
        <div style="text-align:center;margin-bottom:16px;">
          <div style="font-size:42px;font-weight:700;color:${scoreColor};line-height:1;">${c.score}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px;">из 100 баллов</div>
          <div style="height:6px;background:var(--bg3);border-radius:3px;margin-top:10px;overflow:hidden;">
            <div style="height:100%;background:${scoreColor};border-radius:3px;width:${c.score}%;transition:width 1s ease;"></div>
          </div>
        </div>

        <!-- Мини-критерии -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
          ${[
            {l:"Лидерство",v:c.leadership,col:"#818cf8"},
            {l:"Рост",v:c.growth,col:"#34d399"},
            {l:"Мотивация",v:c.motivation,col:"#fbbf24"},
            {l:"Аутентичность",v:c.authenticity,col:"#f472b6"},
          ].map(cr=>`
            <div style="background:var(--bg2);border-radius:10px;padding:10px;">
              <div style="font-size:10px;color:var(--text3);margin-bottom:4px;">${cr.l}</div>
              <div style="font-size:16px;font-weight:700;color:${cr.col};">${cr.v}<span style="font-size:10px;color:var(--text3);font-weight:400;">/25</span></div>
            </div>
          `).join("")}
        </div>

        <!-- Вывод -->
        <div style="font-size:12px;color:var(--text2);line-height:1.5;border-top:1px solid var(--border);padding-top:12px;">${c.summary}</div>

        <!-- Кнопка карточки -->
        <button onclick="event.stopPropagation();celebrate(${c.id})" class="btn btn-green" style="width:100%;margin-top:14px;">🎉 Зачислить!</button>
      </div>`;
  }).join("");
}

// ── ВЫБОР ДЛЯ СРАВНЕНИЯ ────────────────────────────────────────────
function toggleSelect(id) {
  if (selected.includes(id)) {
    selected = selected.filter(x => x !== id);
  } else {
    if (selected.length >= 2) selected.shift();
    selected.push(id);
  }
  updateSelectHint();
  renderGrid();
}

function updateSelectHint() {
  const hint = document.getElementById("select-hint");
  const btn  = document.getElementById("compare-btn");
  if (selected.length === 2) {
    hint.textContent = "✅ Два кандидата выбраны — можно сравнивать!";
    hint.style.color = "#10b981";
    btn.disabled = false;
    btn.style.opacity = "1";
  } else {
    hint.textContent = `Выбрано: ${selected.length}/2 — нажми на карточку чтобы выбрать`;
    hint.style.color = "var(--text2)";
    btn.disabled = true;
    btn.style.opacity = "0.4";
  }
}

// ── СРАВНЕНИЕ ──────────────────────────────────────────────────────
function openCompare() {
  if (selected.length < 2) return;
  const [a, b] = selected.map(id => allCandidates.find(c => c.id === id));
  const [fgA, bgA] = avatarColors[allCandidates.indexOf(a) % avatarColors.length];
  const [fgB, bgB] = avatarColors[allCandidates.indexOf(b) % avatarColors.length];
  const initA = a.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const initB = b.name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();

  const criteria = [
    { label:"Общий балл",    ka:"score",       kb:"score",       max:100, colorA:"#818cf8", colorB:"#f472b6" },
    { label:"Лидерство",     ka:"leadership",  kb:"leadership",  max:25,  colorA:"#818cf8", colorB:"#f472b6" },
    { label:"Рост",          ka:"growth",      kb:"growth",      max:25,  colorA:"#34d399", colorB:"#fbbf24" },
    { label:"Мотивация",     ka:"motivation",  kb:"motivation",  max:25,  colorA:"#fbbf24", colorB:"#60a5fa" },
    { label:"Аутентичность", ka:"authenticity",kb:"authenticity",max:25,  colorA:"#f472b6", colorB:"#34d399" },
  ];

  const content = document.getElementById("compare-content");
  content.innerHTML = `
    <!-- Шапки кандидатов -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;margin-bottom:20px;text-align:center;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div class="avatar" style="background:${bgA};color:${fgA};margin:0 auto;">${initA}</div>
        <div style="font-size:14px;font-weight:600;color:var(--text);">${a.name}</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text3);">vs</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div class="avatar" style="background:${bgB};color:${fgB};margin:0 auto;">${initB}</div>
        <div style="font-size:14px;font-weight:600;color:var(--text);">${b.name}</div>
      </div>
    </div>

    <!-- Строки критериев -->
    ${criteria.map(cr => {
      const va = a[cr.ka], vb = b[cr.kb];
      const winA = va > vb, winB = vb > va;
      return `
        <div class="compare-row">
          <div style="text-align:center;">
            <div class="compare-val" style="color:${winA?"#10b981":winB?"#ef4444":"var(--text)"};">${va} ${winA?"🏆":""}</div>
            <div style="height:6px;background:var(--bg3);border-radius:3px;margin:6px auto;width:80%;overflow:hidden;">
              <div class="compare-bar" style="width:${Math.round(va/cr.max*100)}%;background:${cr.colorA};"></div>
            </div>
          </div>
          <div class="compare-label">${cr.label}</div>
          <div style="text-align:center;">
            <div class="compare-val" style="color:${winB?"#10b981":winA?"#ef4444":"var(--text)"};">${vb} ${winB?"🏆":""}</div>
            <div style="height:6px;background:var(--bg3);border-radius:3px;margin:6px auto;width:80%;overflow:hidden;">
              <div class="compare-bar" style="width:${Math.round(vb/cr.max*100)}%;background:${cr.colorB};"></div>
            </div>
          </div>
        </div>`;
    }).join("")}

    <!-- Radar charts рядом -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;">
      <div>
        <div style="font-size:12px;color:var(--text3);text-align:center;margin-bottom:8px;">${a.name}</div>
        <canvas id="radarA"></canvas>
      </div>
      <div>
        <div style="font-size:12px;color:var(--text3);text-align:center;margin-bottom:8px;">${b.name}</div>
        <canvas id="radarB"></canvas>
      </div>
    </div>

    <!-- Итог -->
    <div style="margin-top:20px;padding:16px;background:var(--bg2);border-radius:12px;border:1px solid var(--border);text-align:center;">
      <div style="font-size:13px;color:var(--text2);">
        ${a.score > b.score
          ? `🏆 По общему баллу лидирует <strong style="color:#10b981;">${a.name}</strong> (+${a.score - b.score} очков)`
          : b.score > a.score
          ? `🏆 По общему баллу лидирует <strong style="color:#10b981;">${b.name}</strong> (+${b.score - a.score} очков)`
          : `🤝 Кандидаты набрали одинаковый балл — решение за комиссией`}
      </div>
    </div>`;

  document.getElementById("compare-modal").style.display = "flex";

  // Radar charts
  compareCharts.forEach(ch => ch.destroy());
  compareCharts = [];

  [[a, "radarA", "#818cf8"], [b, "radarB", "#f472b6"]].forEach(([cand, canvasId, color]) => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    const gridColor = isDark ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.1)";
    const labelColor = isDark ? "rgba(255,255,255,0.6)" : "rgba(0,0,0,0.6)";
    const ch = new Chart(document.getElementById(canvasId), {
      type:"radar",
      data:{
        labels:["Лидерство","Рост","Мотивация","Аутентичность"],
        datasets:[{
          data:[cand.leadership, cand.growth, cand.motivation, cand.authenticity],
          backgroundColor:`${color}33`,
          borderColor:color,
          borderWidth:2,
          pointBackgroundColor:color,
          pointRadius:4,
        }]
      },
      options:{
        responsive:true,
        scales:{ r:{ min:0,max:25, ticks:{stepSize:5,color:labelColor,backdropColor:"transparent",font:{size:10}}, grid:{color:gridColor}, angleLines:{color:gridColor}, pointLabels:{color:labelColor,font:{size:11}} } },
        plugins:{legend:{display:false}},
        animation:{duration:800},
      }
    });
    compareCharts.push(ch);
  });
}

function closeCompare(e) {
  if (!e || e.target === document.getElementById("compare-modal")) {
    document.getElementById("compare-modal").style.display = "none";
    compareCharts.forEach(ch => ch.destroy());
    compareCharts = [];
  }
}

// ── КОНФЕТТИ ───────────────────────────────────────────────────────
function launchConfetti(count = 80) {
  const colors = ["#818cf8","#34d399","#f472b6","#fbbf24","#60a5fa","#fb7185","#a78bfa"];
  for (let i = 0; i < count; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = Math.random() * 100 + "vw";
    el.style.top  = "-10px";
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width  = (8 + Math.random() * 8) + "px";
    el.style.height = (8 + Math.random() * 8) + "px";
    el.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    el.style.animationDuration = (1.5 + Math.random() * 2) + "s";
    el.style.animationDelay   = (Math.random() * 0.8) + "s";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

function celebrate(id) {
  launchConfetti(100);
  const c = allCandidates.find(x => x.id === id);
  setTimeout(() => alert(`🎉 ${c.name} зачислен(а) в inVision U!`), 300);
}

function celebrateAll() {
  launchConfetti(200);
  setTimeout(() => alert("🎊 Все кандидаты из shortlist зачислены! Поздравляем!"), 400);
}

// ── ЭКСПОРТ PDF ────────────────────────────────────────────────────
function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  // Заголовок
  doc.setFillColor(26, 26, 46);
  doc.rect(0, 0, 210, 40, "F");
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(18);
  doc.setFont("helvetica", "bold");
  doc.text("TalentRadar — inVision U", 14, 18);
  doc.setFontSize(10);
  doc.setFont("helvetica", "normal");
  doc.text("Shortlist kандидатов · Сезон 2025", 14, 28);
  doc.text(`Дата экспорта: ${new Date().toLocaleDateString("ru-RU")}`, 14, 36);

  let y = 54;

  allCandidates.forEach((c, i) => {
    if (y > 240) { doc.addPage(); y = 20; }

    // Карточка кандидата
    doc.setFillColor(245, 245, 250);
    doc.roundedRect(12, y, 186, 44, 4, 4, "F");

    // Имя и балл
    doc.setTextColor(26, 26, 46);
    doc.setFontSize(13);
    doc.setFont("helvetica", "bold");
    doc.text(`${i+1}. ${c.name}`, 18, y + 10);

    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(100, 100, 120);
    doc.text(`@${c.username}`, 18, y + 18);

    // Балл
    doc.setFontSize(20);
    doc.setFont("helvetica", "bold");
    doc.setTextColor(99, 102, 241);
    doc.text(`${c.score}`, 170, y + 14);
    doc.setFontSize(9);
    doc.setTextColor(150, 150, 170);
    doc.text("/100", 182, y + 14);

    // Критерии
    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(80, 80, 100);
    doc.text(`Лидерство: ${c.leadership}/25   Рост: ${c.growth}/25   Мотивация: ${c.motivation}/25   Аутентичность: ${c.authenticity}/25`, 18, y + 28);

    // Вывод
    doc.setFontSize(8);
    doc.setTextColor(120, 120, 140);
    const lines = doc.splitTextToSize(c.summary, 168);
    doc.text(lines[0], 18, y + 38);

    y += 54;
  });

  // Подпись
  doc.setFontSize(9);
  doc.setTextColor(150, 150, 170);
  doc.text("Сформировано системой TalentRadar · AI-поддержка приёмной комиссии inVision U", 14, 285);

  doc.save("shortlist-invision-u-2025.pdf");
}
